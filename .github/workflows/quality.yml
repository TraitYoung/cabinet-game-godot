name: Quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: bash scripts/check_quality.sh
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser scenarios
        run: |
          .venv/bin/python scripts/stack_process.py start .devstack/frontend.json -- bash -lc 'cd frontend && npm run dev'
          trap '.venv/bin/python scripts/stack_process.py stop .devstack/frontend.json' EXIT
          .venv/bin/python scripts/check_frontend_interactions.py
  windows-process-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - run: python scripts/check_process_ownership.py
