[tool.ruff]
target-version = "py313"
line-length = 110
include = ["config/settings.py", "infrastructure/*.py", "storage/*.py", "schemas/turns.py", "app/factory.py", "modules/chat_api/*.py", "agents/proactive.py", "test_suite/test_maintenance*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["config/settings.py", "schemas/turns.py", "storage/database.py"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
show_error_codes = true
